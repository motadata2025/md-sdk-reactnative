name: Motadata No-Datadog Gate

# Fails if any non-legal "datadog" token appears on a SHIPPED surface
# (JS public source + Android core bridge source + build.gradle + package manifests).
#
# Two intentional, documented exceptions are NOT treated as failures:
#   1. The Apache-2.0 attribution header (legally required).
#   2. `_dd.*` contract keys (e.g. `_dd.source`, `_dd.trace_id`) — these are the
#      app -> native-SDK handshake / recognized-attribute keys that the FROZEN
#      Motadata Android SDK (com.motadata:motadata-rum-android:1.0.1) still reads
#      verbatim; the native SDK itself performs the `_dd`->`_md` rebrand on the
#      wire, so `_dd.*` never leaves the device as `_dd`. (Verified in Phase 2.)

on:
  push:
    branches: [motadata-dev]
  workflow_dispatch:

jobs:
  no-datadog:
    name: Grep shipped surfaces for datadog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          set -uo pipefail
          # Forbidden tokens (case-insensitive). NOTE: `_dd.` is deliberately absent — see header comment.
          FORBIDDEN='datadog|dd-sdk|com\.datadoghq|ddsource|ddtags|DD-API-KEY|DD-EVP|DD-REQUEST|DD-IDEMPOTENCY'
          # Legal exception: Apache-2.0 attribution header lines only.
          WHITELIST='developed at Datadog|Datadog, Inc\.'

          SCAN_PATHS="packages/core/src packages/core/android/src packages/react-navigation/src"
          # NOTE: README.md files are always shipped by npm regardless of the package `files` array,
          # so they are client-facing (npmjs page + node_modules) and MUST be scanned.
          SCAN_FILES="packages/core/android/build.gradle package.json packages/core/package.json packages/react-navigation/package.json lerna.json packages/core/README.md packages/react-navigation/README.md"

          matches=$(
            { grep -rniE "$FORBIDDEN" $SCAN_PATHS 2>/dev/null || true; \
              grep -niE  "$FORBIDDEN" $SCAN_FILES 2>/dev/null || true; } \
            | grep -viE "$WHITELIST" || true
          )

          if [ -n "$matches" ]; then
            echo "❌ Non-legal datadog references found on shipped surfaces:"
            echo "-------------------------------------------------------------"
            echo "$matches"
            echo "-------------------------------------------------------------"
            echo "Count: $(echo "$matches" | grep -c .)"
            exit 1
          fi
          echo "✅ Zero non-legal datadog references on shipped surfaces."
