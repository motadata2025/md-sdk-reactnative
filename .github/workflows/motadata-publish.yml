name: Motadata RN SDK Publish (npm)

# Publishes the core package (@motadata365/mobile-react-native) to public npmjs.
# Manual dispatch only. Requires repo secret NPM_TOKEN (npmjs automation token).
# Used in Phase 2 — not run during Phase 0/1 bootstrap.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (npm publish --dry-run, no upload)'
        type: boolean
        default: true

jobs:
  publish:
    name: npm publish core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Enable corepack (yarn 3.4.1)
        run: corepack enable
      - name: Install deps
        run: yarn install --no-immutable
      - name: Build all packages
        run: yarn prepare
      - name: Publish core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
